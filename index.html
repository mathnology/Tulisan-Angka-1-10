<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permainan Cocokkan Angka</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    html {
      height: 100%;
    }

    .game-container {
      min-height: 100%;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      margin: 0 0 12px 0;
    }

    .instruction {
      font-size: 20px;
      margin: 0;
    }

    .game-board {
      display: flex;
      gap: 48px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .number-card, .word-card {
      width: 140px;
      height: 80px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 4px solid transparent;
    }

    .number-card {
      font-size: 40px;
    }

    .number-card:hover, .word-card:hover {
      transform: scale(1.05);
    }

    .number-card.selected, .word-card.selected {
      border-width: 4px;
      border-style: solid;
      transform: scale(1.08);
    }

    .number-card.matched, .word-card.matched {
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(0.95);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .reset-button {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .reset-button:hover {
      transform: scale(1.05);
    }

    .message {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      min-height: 32px;
      padding: 12px 24px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .message.show {
      animation: bounce 0.5s ease;
    }

    .message.correct {
      background: #4CAF50;
      color: white;
    }

    .message.wrong {
      background: #f44336;
      color: white;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .card-correct {
      animation: pulse 0.5s ease;
    }

    .card-wrong {
      animation: shake 0.5s ease;
    }

    @media (max-width: 768px) {
      .game-board {
        gap: 24px;
      }
      
      .title {
        font-size: 36px;
      }
      
      .instruction {
        font-size: 18px;
      }
      
      .number-card, .word-card {
        width: 120px;
        height: 70px;
        font-size: 28px;
      }
      
      .number-card {
        font-size: 36px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="game-container">
   <header class="header">
    <h1 class="title" id="gameTitle">🎯 Cocokkan Angka!</h1>
    <p class="instruction" id="instructionText">Klik angka, lalu klik kata yang sesuai</p>
   </header>
   <div class="game-board">
    <div class="column" id="wordsColumn"></div>
    <div class="column" id="numbersColumn"></div>
   </div>
   <div class="controls">
    <div class="message" id="message"></div><button class="reset-button" id="resetButton">🔄 Main Lagi</button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      background_color: "#FFF4E6",
      number_card_color: "#FF6B9D",
      word_card_color: "#4ECDC4",
      text_color: "#2C3E50",
      button_color: "#FFD93D",
      selection_border_color: "#FF6B9D",
      game_title: "🎯 Cocokkan Angka!",
      instruction_text: "Klik kata, lalu klik angka yang sesuai",
      reset_button_text: "🔄 Main Lagi",
      success_message: "🎉 Hebat! Semua benar!"
    };

    const numbers = [
      { num: 1, word: "Satu" },
      { num: 2, word: "Dua" },
      { num: 3, word: "Tiga" },
      { num: 4, word: "Empat" },
      { num: 5, word: "Lima" },
      { num: 6, word: "Enam" },
      { num: 7, word: "Tujuh" },
      { num: 8, word: "Delapan" },
      { num: 9, word: "Sembilan" },
      { num: 10, word: "Sepuluh" }
    ];

    let selectedWord = null;
    let matchedPairs = new Set();

    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    function initGame() {
      const numbersColumn = document.getElementById('numbersColumn');
      const wordsColumn = document.getElementById('wordsColumn');
      const messageEl = document.getElementById('message');
      
      numbersColumn.innerHTML = '';
      wordsColumn.innerHTML = '';
      messageEl.textContent = '';
      messageEl.className = 'message';
      
      selectedWord = null;
      matchedPairs.clear();

      const shuffledNumbers = shuffleArray(numbers);
      const shuffledWords = shuffleArray(numbers);

      shuffledNumbers.forEach(item => {
        const card = document.createElement('div');
        card.className = 'number-card';
        card.textContent = item.num;
        card.dataset.num = item.num;
        card.addEventListener('click', () => selectNumber(item.num));
        numbersColumn.appendChild(card);
      });

      shuffledWords.forEach(item => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.textContent = item.word;
        card.dataset.num = item.num;
        card.addEventListener('click', () => selectWord(item.num));
        wordsColumn.appendChild(card);
      });

      applyStyles();
    }

    function selectWord(num) {
      if (matchedPairs.has(num)) return;

      document.querySelectorAll('.word-card').forEach(card => {
        card.classList.remove('selected');
      });

      const card = document.querySelector(`.word-card[data-num="${num}"]`);
      card.classList.add('selected');
      selectedWord = num;

      const messageEl = document.getElementById('message');
      messageEl.textContent = '';
      messageEl.className = 'message';
    }

    function selectNumber(num) {
      if (matchedPairs.has(num) || selectedWord === null) return;

      if (selectedWord === num) {
        matchedPairs.add(num);
        
        const numberCard = document.querySelector(`.number-card[data-num="${num}"]`);
        const wordCard = document.querySelector(`.word-card[data-num="${num}"]`);
        
        // Animasi benar
        numberCard.classList.add('card-correct');
        wordCard.classList.add('card-correct');
        
        setTimeout(() => {
          numberCard.classList.add('matched');
          numberCard.classList.remove('card-correct');
          wordCard.classList.remove('selected', 'card-correct');
          wordCard.classList.add('matched');
        }, 500);
        
        selectedWord = null;

        const messageEl = document.getElementById('message');
        messageEl.textContent = '✅ Benar!';
        messageEl.className = 'message show correct';
        
        if (matchedPairs.size === numbers.length) {
          setTimeout(() => {
            const config = window.elementSdk?.config || defaultConfig;
            messageEl.textContent = config.success_message || defaultConfig.success_message;
            messageEl.className = 'message show correct';
          }, 500);
        }
      } else {
        const messageEl = document.getElementById('message');
        messageEl.textContent = '❌ Coba lagi!';
        messageEl.className = 'message show wrong';
        
        // Animasi salah
        const selectedCard = document.querySelector('.word-card.selected');
        const numberCard = document.querySelector(`.number-card[data-num="${num}"]`);
        
        if (selectedCard) {
          selectedCard.classList.add('card-wrong');
          setTimeout(() => {
            selectedCard.classList.remove('card-wrong');
          }, 500);
        }
        
        numberCard.classList.add('card-wrong');
        setTimeout(() => {
          numberCard.classList.remove('card-wrong');
        }, 500);
        
        document.querySelectorAll('.word-card').forEach(card => {
          card.classList.remove('selected');
        });
        selectedWord = null;
      }
    }

    function applyStyles() {
      const config = window.elementSdk?.config || defaultConfig;
      
      document.querySelector('.game-container').style.background = config.background_color || defaultConfig.background_color;
      
      document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('gameTitle').style.color = config.text_color || defaultConfig.text_color;
      
      document.getElementById('instructionText').textContent = config.instruction_text || defaultConfig.instruction_text;
      document.getElementById('instructionText').style.color = config.text_color || defaultConfig.text_color;
      
      document.getElementById('resetButton').textContent = config.reset_button_text || defaultConfig.reset_button_text;
      document.getElementById('resetButton').style.background = config.button_color || defaultConfig.button_color;
      document.getElementById('resetButton').style.color = config.text_color || defaultConfig.text_color;
      
      document.getElementById('message').style.color = config.text_color || defaultConfig.text_color;

      document.querySelectorAll('.number-card').forEach(card => {
        card.style.background = config.number_card_color || defaultConfig.number_card_color;
        card.style.color = '#FFFFFF';
        if (card.classList.contains('selected')) {
          card.style.borderColor = config.selection_border_color || defaultConfig.selection_border_color;
        }
      });

      document.querySelectorAll('.word-card').forEach(card => {
        card.style.background = config.word_card_color || defaultConfig.word_card_color;
        card.style.color = '#FFFFFF';
        if (card.classList.contains('selected')) {
          card.style.borderColor = config.selection_border_color || defaultConfig.selection_border_color;
        }
      });
    }

    document.getElementById('resetButton').addEventListener('click', initGame);

    async function onConfigChange(config) {
      applyStyles();
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.number_card_color || defaultConfig.number_card_color,
              set: (value) => {
                config.number_card_color = value;
                window.elementSdk.setConfig({ number_card_color: value });
              }
            },
            {
              get: () => config.word_card_color || defaultConfig.word_card_color,
              set: (value) => {
                config.word_card_color = value;
                window.elementSdk.setConfig({ word_card_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["game_title", config.game_title || defaultConfig.game_title],
          ["instruction_text", config.instruction_text || defaultConfig.instruction_text],
          ["reset_button_text", config.reset_button_text || defaultConfig.reset_button_text],
          ["success_message", config.success_message || defaultConfig.success_message]
        ])
      });
    }

    initGame();
  </script>
